---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ballast-worker3
  namespace: data-pipeline
  labels:
    app.kubernetes.io/name: ballast
    app.kubernetes.io/part-of: kubescalesense-demo
    kubescalesense.io/target-node: worker3
spec:
  # worker3 is the full node: enough ballast that no Normalizer fits. This is
  # what makes "free CPU exists in the cluster but nothing fits" true at the
  # same time (E2E-04).
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ballast
      kubescalesense.io/target-node: worker3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ballast
        app.kubernetes.io/part-of: kubescalesense-demo
        kubescalesense.io/target-node: worker3
    spec:
      nodeName: kubescalesense-demo-worker3
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
