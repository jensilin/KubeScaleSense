apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescalesense
  namespace: kubescalesense
  labels:
    app.kubernetes.io/name: kubescalesense
    app.kubernetes.io/component: controller
# The controller's own token is the only credential it ever holds. It has no
# workload credentials of any kind: the workload-pressure signal is generated
# locally or scraped over in-cluster HTTP, so there is no database role, broker
# user, or API token (CR-5, FR-37, docs/architecture.md § 7).
automountServiceAccountToken: true
