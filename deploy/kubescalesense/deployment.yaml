# Controller Deployment — Phase 1, not applied by any automation.
#
# What this pod does today: watches nodes, pods, the target Deployment, its
# ReplicaSets, and HorizontalPodAutoscalers; reads pod metrics; and reports the
# scaling decision it would make. It scales nothing. Its Kubernetes client
# rejects mutating requests at the transport layer and its ServiceAccount has
# no write permission, so the read-only claim holds even if the code is wrong.
#
# replicas is 1 and stays 1 until P4 adds leader election (FR-26). Two replicas
# without a Lease would be two controllers writing the same replica count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescalesense
  namespace: kubescalesense
  labels:
    app.kubernetes.io/name: kubescalesense
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubescalesense
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubescalesense
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kubescalesense
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: kubescalesense:dev
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/kubescalesense/kubescalesense.yaml
          # The synthetic source now exists and the ConfigMap carries a
          # scripted series, so the Phase 0 override that forced
          # workload.signal.source to `none` is gone: the pod runs the
          # documented default.
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          # Modest but real: the controller is a single-threaded loop over
          # informer caches. Requests are set equal to limits for memory so the
          # pod is Guaranteed for memory and cannot be evicted ahead of the
          # workload it is meant to be protecting.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
          # /healthz answers as soon as the listener is up; /readyz waits for
          # the informer caches to sync and for a recent successful reconcile.
          # The startup probe carries the cold cache list, so a slow first
          # sync on a large cluster is not read as a liveness failure.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          # Not ready is not a reason to restart: a controller that has lost its
          # metrics source recovers by itself, and restarting it would only
          # discard the decision history it needs for a stable scale-down.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/kubescalesense
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubescalesense-config
      terminationGracePeriodSeconds: 30
