# Controller Deployment — not applied by any automation.
#
# Each pod watches nodes, pods, the target Deployment, its ReplicaSets, and
# HorizontalPodAutoscalers; reads pod metrics; and decides a replica count. In
# dry-run (the shipped default) it only reports that decision. Live, it writes
# through deployments/scale, and only the holder of the Lease
# data-pipeline/kubescalesense-normalizer decides at all (FR-26).
#
# Two replicas, so losing the leader's pod or node costs one lease duration
# (15s) rather than a reschedule and an image pull. The standby keeps its caches
# synced and is ready, but makes no decision until it holds the lease; a leader
# that loses the lease exits and restarts as a standby. In dry-run neither
# campaigns and both report, which writes nothing either way.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescalesense
  namespace: kubescalesense
  labels:
    app.kubernetes.io/name: kubescalesense
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  # RollingUpdate is safe because the lease, not the pod count, bounds the
  # writers: a new pod stands by until the old leader stops and releases. One
  # pod at a time, so a rollout never removes both and leaves no standby.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kubescalesense
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubescalesense
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kubescalesense
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: kubescalesense:dev
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/kubescalesense/kubescalesense.yaml
          # The synthetic source now exists and the ConfigMap carries a
          # scripted series, so the Phase 0 override that forced
          # workload.signal.source to `none` is gone: the pod runs the
          # documented default.
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          # Modest but real: the controller is a single-threaded loop over
          # informer caches. Requests are set equal to limits for memory so the
          # pod is Guaranteed for memory and cannot be evicted ahead of the
          # workload it is meant to be protecting.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
          # /healthz answers as soon as the listener is up; /readyz waits for
          # the informer caches to sync and, on the leader, for a recent
          # successful reconcile. A standby is ready once synced: otherwise a
          # rollout would wait forever for a pod that can only lead after the
          # old one has gone.
          # The startup probe carries the cold cache list, so a slow first
          # sync on a large cluster is not read as a liveness failure.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          # Not ready is not a reason to restart: a controller that has lost its
          # metrics source recovers by itself, and restarting it would only
          # discard the decision history it needs for a stable scale-down.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/kubescalesense
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubescalesense-config
      terminationGracePeriodSeconds: 30
